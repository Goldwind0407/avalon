name: avalon_shadow_council
description: Avalon Shadow Council - Traditional Chinese pass-and-play party game
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  flutter_webrtc: ^1.6.3
  shared_preferences: ^2.5.6
  web: ^1.1.1
dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/roles/
    - assets/images/cards/
    - assets/images/tokens/
    - assets/images/logos/
    - assets/images/boards/
    - assets/images/brand/

# App icon (source: 素材/APP icon.jpg, prepared into assets/icon/).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon_full.png
  android: true
  adaptive_icon_background: "#252d45"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon_full.png
    background_color: "#252d45"
    theme_color: "#252d45"
