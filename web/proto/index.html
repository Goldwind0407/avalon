<!DOCTYPE html>
<!--
  A trial, not part of the game: the table's heaviest changes of screen
  (the votes turned over, the next speaker, a quest's cards) drawn by the
  browser itself, HTML and CSS, with the game's own pictures and sounds, to
  set against the Flutter build on the same phone. Every frame is timed as
  in the game (lib/core/web_perf_web.dart) and each round of the three is
  reported the same way (stages protoVote, protoTurn, protoQuest).
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Avalon · 畫面試作</title>
<style>
  :root {
    --gold: #ebc780; --muted: #b9b2a2; --good: #6aa8ff; --evil: #ff5a5a;
    --felt: #1f4a3a; --felt-edge: #2f6b52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f1c; color: #f3ead6; overflow: hidden;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #table { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left); overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 45%, #0000 40%, #000a 100%),
      repeating-linear-gradient(90deg, #5a3520 0 3px, #4d2c1a 3px 7px, #61391f 7px 12px),
      linear-gradient(#4a2a18, #3a2012); }
  #table.shake { animation: shake .42s ease-out; }
  @keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -2px); }
    60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }

  /* the felt and its board */
  #felt { position: absolute; left: 50%; top: 55%; height: min(76vh, calc(60vw / 1.45), 386px); aspect-ratio: 1.45;
    transform: translate(-50%, -50%); border-radius: 18px; background: var(--felt);
    border: 3px solid #173528; box-shadow: 0 10px 30px #000a, inset 0 0 0 6px var(--felt-edge);
    padding: 34px 14px 14px; }
  #felt::after { content: ''; position: absolute; inset: 8px; border: 1.5px dashed #9cc7a466; border-radius: 12px; pointer-events: none; }
  #felt h1 { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 16px; color: var(--gold); letter-spacing: 2px; }
  #board { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }

  /* seats */
  .plate { position: absolute; width: 128px; height: 46px; border-radius: 10px;
    background: linear-gradient(#3b2416, #2a180d); border: 1.5px solid #8a6a3c;
    display: flex; align-items: center; gap: 8px; padding: 0 8px; box-shadow: 0 4px 10px #0008; }
  .plate .no { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(#f6dc9c, #c9a35a);
    color: #3a2414; font-weight: 700; display: grid; place-items: center; font-size: 14px; }
  .plate .name { font-size: 14px; flex: 1; }
  .plate .slot { width: 26px; height: 39px; perspective: 400px; }
  .plate.speaking { border-color: var(--gold); animation: speak 1.2s ease-in-out infinite; }
  @keyframes speak { 50% { box-shadow: 0 0 18px #ebc780cc, 0 4px 10px #0008; } }
  .candle { position: absolute; width: 90px; height: 90px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(#ffb45a55, #0000 70%); animation: flicker 2.3s ease-in-out infinite alternate; }
  @keyframes flicker { 0% { opacity: .55; transform: scale(.92); } 40% { opacity: .8; }
    100% { opacity: .6; transform: scale(1.06); } }

  /* a two-sided card */
  .card { position: absolute; transform-style: preserve-3d; will-change: transform; }
  .card .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 3px; box-shadow: 0 3px 6px #0009; }
  .card .face img { width: 100%; height: 100%; display: block; border-radius: inherit; }
  .card .front { transform: rotateY(180deg); }
  .card.up .turn { transform: rotateY(180deg); }
  .card .turn { position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .42s cubic-bezier(.65, 0, .35, 1); }

  /* the verdict stamp and the bar under the felt */
  #stamp { position: absolute; left: 50%; top: 44%; padding: 4px 20px; border-radius: 8px;
    border: 3px solid currentColor; background: #0008; font-size: 34px; font-weight: 800; letter-spacing: 10px;
    box-shadow: 0 0 18px currentColor; opacity: 0; pointer-events: none; transform: translate(-50%, -50%); }
  #stamp.in { animation: stamp .38s cubic-bezier(.2, .9, .3, 1.2) forwards; }
  @keyframes stamp { from { opacity: 0; transform: translate(-50%, -50%) scale(2.6) rotate(-6deg); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-6deg); } }
  #bar { position: absolute; left: 50%; bottom: 8px; transform: translate(-50%, 12px); opacity: 0;
    transition: opacity .3s, transform .3s; display: flex; gap: 12px; align-items: center;
    background: #000a; border: 1px solid #8a6a3c; padding: 6px 12px; border-radius: 12px; font-size: 13px; white-space: nowrap; }
  #bar.in { opacity: 1; transform: translate(-50%, 0); }
  #bar b { background: var(--gold); color: #171d30; padding: 6px 14px; border-radius: 999px; }

  /* the next speaker's words */
  #speech { position: absolute; left: 50%; top: 50%; width: min(56vw, 520px); transform: translate(-50%, -40%);
    opacity: 0; transition: opacity .3s ease-out, transform .3s ease-out; background: linear-gradient(#24324a, #1a2438);
    border: 1.5px solid var(--gold); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px;
    box-shadow: 0 10px 30px #000c; pointer-events: none; }
  #speech.in { opacity: 1; transform: translate(-50%, -52%); }
  #speech img { width: 64px; height: 96px; border-radius: 8px; object-fit: cover; }
  #speech h2 { font-size: 15px; color: var(--gold); margin-bottom: 6px; }
  #speech p { font-size: 13px; line-height: 1.55; }

  /* the quest's cards over the blurred table */
  #scrim { position: absolute; inset: 0; background: #0009; opacity: 0; pointer-events: none;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: opacity .34s ease-out;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #scrim.in { opacity: 1; }
  #scrim .row { display: flex; gap: 16px; perspective: 900px; }
  #scrim .card { position: relative; width: 96px; height: 144px; }
  #scrim .card.glow-fail .face.front { box-shadow: 0 0 22px #ff5a5acc; }
  #scrim .card.glow-ok .face.front { box-shadow: 0 0 22px #ffd27acc; }
  #verdict { font-size: 36px; font-weight: 800; letter-spacing: 8px; color: var(--evil);
    text-shadow: 0 0 16px #ff5a5a; opacity: 0; transform: scale(1.8); transition: opacity .3s, transform .45s cubic-bezier(.2, .9, .3, 1.2); }
  #verdict.in { opacity: 1; transform: scale(1); }
  .ember { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ff9a4a;
    box-shadow: 0 0 8px #ff7a2a; animation: rise 1.8s ease-out forwards; }
  @keyframes rise { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--dx), -220px); } }

  /* dust in the light */
  .dust { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff3c8;
    opacity: 0; animation: drift linear infinite; pointer-events: none; }
  @keyframes drift { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: .55; }
    80% { opacity: .35; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }

  /* controls and the meter */
  #controls { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 6px);
    display: flex; gap: 6px; z-index: 5; }
  #controls button, #controls a { text-decoration: none; line-height: normal; font-weight: 600; font-size: 12px; font-family: inherit; padding: 6px 10px; border-radius: 999px;
    border: 1px solid #8a6a3c; background: #2a180dcc; color: #f3ead6; }
  #controls button.on { background: var(--gold); color: #171d30; }
  #meter { position: fixed; left: calc(env(safe-area-inset-left) + 6px); top: calc(env(safe-area-inset-top) + 6px);
    z-index: 5; font: 10px/1.4 ui-monospace, monospace; background: #000b; color: #9f9; padding: 4px 7px;
    border-radius: 6px; white-space: pre; pointer-events: none; max-width: 46vw; }
  #start { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #000c;
    font-size: 18px; color: var(--gold); text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div id="table">
  <div id="felt"><h1>第三次遠征・投票</h1><img id="board" src="../assets/assets/images/boards/board_6p.webp" alt=""></div>
  <div id="stamp"></div>
  <div id="bar"><span id="barText"></span><b>開始秘密執行任務</b></div>
  <div id="speech"><img id="face" alt=""><div><h2 id="who"></h2><p id="words"></p></div></div>
  <div id="scrim"><div class="row" id="quest"></div><div id="verdict">任務失敗</div></div>
</div>
<div id="meter">試作・量測中</div>
<div id="controls">
  <button data-scene="vote">投票結果</button>
  <button data-scene="turn">下一位發言</button>
  <button data-scene="quest">任務翻牌</button>
  <button id="loop" class="on">自動循環</button>
  <a id="back" href="../">回遊戲</a>
</div>
<div id="start">HTML／CSS 試作<br>點一下開始（會有音效）</div>
<script>
(() => {
  const A = '../assets/assets/';
  const table = document.getElementById('table');
  const names = ['你', '阿哲', '小虎', '小魚', '米亞', '蓉蓉'];
  const plates = [];

  // ── the table: six seats, candles, dust ──
  function layout() {
    const w = table.clientWidth, h = table.clientHeight;
    const rows = [h * .27, h * .54, h * .81];
    plates.forEach((p, i) => {
      const left = i < 3, row = left ? 2 - i : i - 3;
      p.el.style.left = (left ? 10 : w - 138) + 'px';
      p.el.style.top = (rows[row] - 23) + 'px';
      p.candle.style.left = (left ? 10 + 128 : w - 138 - 70) + 'px';
      p.candle.style.top = (rows[row] - 45) + 'px';
    });
  }
  names.forEach((name, i) => {
    const el = document.createElement('div');
    el.className = 'plate';
    el.innerHTML = `<span class="no">${i + 1}</span><span class="name">${name}</span><span class="slot"></span>`;
    const candle = document.createElement('div');
    candle.className = 'candle';
    candle.style.animationDelay = (-i * .37) + 's';
    table.append(candle, el);
    plates.push({ el, candle, slot: el.querySelector('.slot') });
  });
  for (let i = 0; i < 26; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = Math.random() * 100 + '%';
    d.style.top = Math.random() * 100 + '%';
    d.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    d.style.setProperty('--dy', (Math.random() * -90 - 20) + 'px');
    d.style.animationDuration = (5 + Math.random() * 6) + 's';
    d.style.animationDelay = (-Math.random() * 8) + 's';
    table.append(d);
  }
  addEventListener('resize', layout);
  layout();

  // ── sounds: decoded once into the audio engine, as the game does ──
  const audio = new (window.AudioContext || window.webkitAudioContext)();
  const sounds = {};
  for (const n of ['flip', 'approve', 'reject', 'turn', 'failure', 'questStart']) {
    fetch(`${A}audio/${n}.wav`).then(r => r.arrayBuffer()).then(b => audio.decodeAudioData(b))
      .then(buf => { sounds[n] = buf; }).catch(() => {});
  }
  function play(n) {
    const buf = sounds[n];
    if (!buf || audio.state !== 'running') return;
    const s = audio.createBufferSource();
    s.buffer = buf;
    s.connect(audio.destination);
    s.start();
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  function card(back, front, w, h) {
    const c = document.createElement('div');
    c.className = 'card';
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.innerHTML = `<div class="turn"><div class="face back"><img src="${back}"></div>` +
      `<div class="face front"><img src="${front}"></div></div>`;
    return c;
  }
  function flipped(c) {
    return new Promise(r => {
      c.querySelector('.turn').addEventListener('transitionend', r, { once: true });
      c.classList.add('up');
    });
  }

  // ── 1. the votes turned over ──
  async function vote() {
    const votes = [true, false, true, true, false, true];
    const yes = votes.filter(Boolean).length, passed = yes > votes.length / 2;
    const center = { x: table.clientWidth / 2 - 13, y: table.clientHeight / 2 - 20 };
    const cards = plates.map((p, i) => {
      const r = p.slot.getBoundingClientRect(), t = table.getBoundingClientRect();
      const c = card(`${A}images/cards/card_back_vote_seat.webp`,
        `${A}images/cards/${votes[i] ? 'vote_approve' : 'vote_reject'}_seat.webp`, 26, 39);
      c.style.left = (r.left - t.left) + 'px';
      c.style.top = (r.top - t.top) + 'px';
      c.style.perspective = '400px';
      table.append(c);
      const dx = center.x - (r.left - t.left), dy = center.y - (r.top - t.top);
      c.animate([{ transform: `translate(${dx}px, ${dy}px) scale(1.8)`, opacity: 0 },
                 { transform: `translate(${dx}px, ${dy}px) scale(1.8)`, opacity: 1, offset: .1 },
                 { transform: 'translate(0, 0) scale(1)' }],
        { duration: 480, delay: 120 * i, easing: 'cubic-bezier(.2, .8, .3, 1)', fill: 'backwards' });
      return c;
    });
    await wait(120 * cards.length + 480);
    await Promise.all(cards.map(async (c, i) => {
      await wait(180 + 55 * i);
      await flipped(c);
      play('flip');
    }));
    const stamp = document.getElementById('stamp');
    stamp.textContent = passed ? '通過' : '否決';
    stamp.style.color = passed ? 'var(--good)' : 'var(--evil)';
    stamp.classList.add('in');
    await wait(380);
    play(passed ? 'approve' : 'reject');
    table.classList.remove('shake'); void table.offsetWidth; table.classList.add('shake');
    document.getElementById('barText').textContent =
      `贊成 ${yes} · 反對 ${votes.length - yes}　—　${passed ? '組隊通過' : '組隊遭否決'}`;
    await wait(120);
    document.getElementById('bar').classList.add('in');
    await wait(1600);
    stamp.classList.remove('in');
    document.getElementById('bar').classList.remove('in');
    cards.forEach(c => c.remove());
  }

  // ── 2. the next speaker ──
  const speakers = [
    [1, 'merlin', '我覺得這隊有問題，2 號剛才的票很奇怪，我想再觀察一輪。'],
    [2, 'morgana', '我是派西維爾，我看到的兩個人裡，4 號比較像梅林，大家跟我投。'],
    [4, 'assassin', '先別急著下結論，上一輪任務失敗只有一張，隊伍裡可能只混了一個。'],
  ];
  let turnNo = 0;
  async function turn() {
    const [seat, role, text] = speakers[turnNo++ % speakers.length];
    plates.forEach((p, i) => p.el.classList.toggle('speaking', i === seat));
    play('turn');
    document.getElementById('face').src = `${A}images/portraits/${role}.webp`;
    document.getElementById('who').textContent = `${seat + 1} 號・${names[seat]}`;
    document.getElementById('words').textContent = text;
    const speech = document.getElementById('speech');
    speech.classList.add('in');
    await wait(2200);
    speech.classList.remove('in');
    plates.forEach(p => p.el.classList.remove('speaking'));
    await wait(300);
  }

  // ── 3. a quest's cards over the blurred table ──
  async function quest() {
    const results = [true, true, false, true];
    const scrim = document.getElementById('scrim'), row = document.getElementById('quest');
    const verdict = document.getElementById('verdict');
    row.innerHTML = '';
    const cards = results.map(ok => {
      const c = card(`${A}images/cards/card_back_quest.webp`,
        `${A}images/cards/${ok ? 'quest_success' : 'quest_fail'}.webp`, 96, 144);
      c.classList.add(ok ? 'glow-ok' : 'glow-fail');
      row.append(c);
      return c;
    });
    play('questStart');
    scrim.classList.add('in');
    await wait(500);
    for (const c of cards) {
      await flipped(c);
      play('flip');
      await wait(260);
    }
    verdict.classList.add('in');
    play('failure');
    table.classList.remove('shake'); void table.offsetWidth; table.classList.add('shake');
    const rect = verdict.getBoundingClientRect(), t = table.getBoundingClientRect();
    const embers = Array.from({ length: 24 }, () => {
      const e = document.createElement('div');
      e.className = 'ember';
      e.style.left = (rect.left - t.left + Math.random() * rect.width) + 'px';
      e.style.top = (rect.top - t.top + rect.height / 2) + 'px';
      e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      e.style.animationDelay = Math.random() * .4 + 's';
      table.append(e);
      return e;
    });
    await wait(1800);
    scrim.classList.remove('in');
    verdict.classList.remove('in');
    await wait(400);
    embers.forEach(e => e.remove());
  }

  // ── the meter: every frame timed, as in the game ──
  const meter = document.getElementById('meter');
  let last = 0, scene = 'idle';
  const OVERS = [50, 100, 250, 500, 1000];
  let round = null;
  const lines = {};
  function newRound() {
    return { started: performance.now(), frames: 0, drawn: 0, late: 0, gaps: [], worst: 0,
             over: OVERS.map(() => 0), stages: {}, stalls: [] };
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = 0; return; }
    if (last && round && scene !== 'idle') {
      const gap = now - last;
      if (gap < 5000) OVERS.forEach((o, i) => { if (gap >= o) round.over[i]++; });
      if (gap >= 100 && gap < 5000) round.stalls.push({ stage: scene, ms: Math.round(gap), before: [] });
      if (gap < 1000) {
        round.frames++; round.drawn += gap; round.gaps.push(gap);
        if (gap > 25) round.late++;
        round.worst = Math.max(round.worst, gap);
        const s = round.stages[scene] ??= { frames: 0, drawn: 0, late: 0, stalls: 0, worst: 0 };
        s.frames++; s.drawn += gap; if (gap > 25) s.late++; if (gap >= 100) s.stalls++;
        s.worst = Math.max(s.worst, gap);
      } else if (round.stages[scene]) {
        round.stages[scene].worst = Math.max(round.stages[scene].worst, gap);
      }
    }
    last = now;
  }
  requestAnimationFrame(frame);
  const label = { protoVote: '投票結果', protoTurn: '下一位發言', protoQuest: '任務翻牌' };
  async function run(name, fn) {
    scene = name;
    const s0 = round.stages[name] ? { ...round.stages[name] } : null;
    await fn();
    scene = 'idle';
    const s = round.stages[name];
    const worst = Math.round(s ? s.worst : 0);
    const stops = s ? s.stalls - (s0 ? s0.stalls : 0) : 0;
    lines[name] = `${label[name]} 最久 ${worst} ms・停頓 ${stops}`;
    meter.textContent = `HTML 試作・${devicePixelRatio}x\n` + Object.values(lines).join('\n');
    meter.style.color = worst >= 100 ? '#f88' : worst >= 34 ? '#fd6' : '#9f9';
  }

  // each round of the three goes the way the game's reports go
  function report() {
    if (!round || round.frames < 60) return;
    const gaps = round.gaps.sort((a, b) => a - b);
    const r1 = v => Math.round(v * 10) / 10;
    const stalls = round.stalls.sort((a, b) => b.ms - a.ms).slice(0, 8);
    const summary = {
      renderer: 'js', isolated: Boolean(window.crossOriginIsolated), light: false, gaveUp: false,
      fps: r1(1000 * round.frames / round.drawn), latePct: r1(100 * round.late / round.frames),
      p95: r1(gaps[Math.floor(gaps.length * .95)]), worst: Math.round(round.worst),
      slowSeconds: 0, seconds: Math.round(round.drawn / 1000), dpr: devicePixelRatio,
      width: innerWidth, height: innerHeight,
      standalone: matchMedia('(display-mode: standalone)').matches,
      ua: navigator.userAgent, page: '#proto',
      stages: Object.fromEntries(Object.entries(round.stages).map(([k, s]) => [k, {
        fps: r1(1000 * s.frames / s.drawn), latePct: r1(100 * s.late / s.frames),
        seconds: r1(s.drawn / 1000), stalls: s.stalls }])),
      over: Object.fromEntries(OVERS.map((o, i) => [String(o), round.over[i]])),
      stalls,
    };
    try {
      fetch('https://asia-east1-avalon-shadow-council.cloudfunctions.net/perfReport', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: summary }), keepalive: true });
    } catch (_) {}
    round = newRound();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) report(); });

  let looping = true, busy = false;
  const scenes = { vote: ['protoVote', vote], turn: ['protoTurn', turn], quest: ['protoQuest', quest] };
  let loopRunning = false;
  async function loop() {
    if (loopRunning) return;
    loopRunning = true;
    let rounds = 0;
    while (looping) {
      for (const key of ['vote', 'turn', 'quest']) {
        if (!looping) break;
        busy = true;
        await run(...scenes[key]);
        busy = false;
        await wait(600);
      }
      if (++rounds % 2 === 0) report();
    }
    loopRunning = false;
  }
  document.querySelectorAll('[data-scene]').forEach(b => b.addEventListener('click', async () => {
    if (busy) return;
    looping = false;
    document.getElementById('loop').classList.remove('on');
    busy = true;
    await run(...scenes[b.dataset.scene]);
    busy = false;
  }));
  document.getElementById('loop').addEventListener('click', e => {
    if (looping) return;
    looping = true;
    e.target.classList.add('on');
    loop();
  });
  document.getElementById('start').addEventListener('click', e => {
    audio.resume();
    e.currentTarget.remove();
    round = newRound();
    loop();
  }, { once: true });
})();
</script>
</body>
</html>
